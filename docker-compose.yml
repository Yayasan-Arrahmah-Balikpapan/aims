services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    ports:
      - "8000:80" # Map port 8000 di server (aaPanel) ke port 80 di dalam container
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge
